<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Nova Editor - Premium HTML Studio</title>
    <style>
        /* --- TÙY CHỈNH BIẾN MÀU SẮC (PREMIUM DARK) --- */
        :root {
            --bg-color: #09090b;       
            --panel-bg: #18181b;       
            --border-color: #27272a;   
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            
            /* Màu nhấn (Neon Gradient) */
            --accent-primary: #8b5cf6; 
            --accent-secondary: #06b6d4; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- THANH ĐIỀU HƯỚNG TRÊN (NAVBAR) --- */
        .navbar {
            height: 55px;
            background-color: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand svg {
            width: 20px;
            height: 20px;
            stroke: var(--accent-secondary);
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: #27272a;
            color: var(--text-main);
            border: 1px solid #3f3f46;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #3f3f46;
            border-color: #52525b;
        }

        .btn-glow {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-glow:hover {
            background: linear-gradient(135deg, #7c3aed, #0891b2);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
            transform: translateY(-1px);
        }

        /* --- KHÔNG GIAN LÀM VIỆC CHÍNH (WORKSPACE) --- */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
            padding: 15px;
            gap: 0; 
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #panel-left { width: 50%; } 
        #panel-right { flex: 1; }

        .panel-header {
            height: 40px;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            gap: 8px;
        }

        .panel-header i { color: var(--accent-secondary); font-style: normal;}

        /* --- THANH KÉO THẢ (RESIZER) --- */
        .resizer {
            width: 12px;
            cursor: col-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .resizer::after {
            content: '';
            width: 4px;
            height: 40px;
            background-color: var(--border-color);
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .resizer:hover::after, .resizer.active::after {
            background-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        /* --- TRÌNH SOẠN THẢO CODE --- */
        textarea {
            flex: 1;
            width: 100%;
            padding: 20px;
            background: transparent;
            color: #e2e8f0;
            border: none;
            resize: none;
            outline: none;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            font-size: 14.5px;
            line-height: 1.7;
        }

        textarea::placeholder { color: #52525b; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 5px; border: 2px solid var(--panel-bg); }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* --- TRÌNH DUYỆT PREVIEW --- */
        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff; 
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .workspace { flex-direction: column; padding: 10px; }
            #panel-left { width: 100% !important; height: 50vh; }
            .resizer { width: 100%; height: 12px; cursor: row-resize; }
            .resizer::after { width: 40px; height: 4px; }
            .brand span { display: none; }
        }
    </style>
</head>
<body>

    <!-- THANH ĐIỀU HƯỚNG -->
    <nav class="navbar">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <span>NOVA EDITOR</span>
        </div>
        <div class="nav-actions">
            <button class="btn" onclick="clearCode()" title="Xóa toàn bộ code">Xóa</button>
            <button class="btn btn-glow" onclick="openNewTab()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                Mở rộng Web
            </button>
        </div>
    </nav>

    <!-- KHU VỰC CHIA MÀN HÌNH -->
    <main class="workspace">
        
        <!-- TRÁI: CODE -->
        <div class="panel" id="panel-left">
            <div class="panel-header">
                <i>{ }</i> index.html
            </div>
            <!-- Textarea hoàn toàn trống -->
            <textarea id="codeEditor" spellcheck="false" placeholder="Viết mã HTML/CSS/JS tại đây..."></textarea>
        </div>

        <!-- THANH KÉO Ở GIỮA -->
        <div class="resizer" id="dragMe" title="Kéo để thay đổi kích thước"></div>

        <!-- PHẢI: PREVIEW -->
        <div class="panel" id="panel-right">
            <div class="panel-header">
                <i>⚡</i> Live Preview
            </div>
            <iframe id="previewFrame"></iframe>
        </div>

    </main>

    <script>
        const editor = document.getElementById('codeEditor');
        const preview = document.getElementById('previewFrame');

        // --- 1. TÍNH NĂNG LIVE PREVIEW ---
        function updatePreview() {
            const iframeDoc = preview.contentDocument || preview.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(editor.value);
            iframeDoc.close();
        }
        editor.addEventListener('input', updatePreview);
        
        // Tự động focus vào khung gõ code khi mở trang
        window.onload = function() {
            updatePreview();
            editor.focus();
        };

        // --- 2. MỞ TRANG WEB TAB MỚI ---
        function openNewTab() {
            const newTab = window.open();
            newTab.document.open();
            newTab.document.write(editor.value);
            newTab.document.close();
            newTab.document.title = "Nova Editor - Preview";
        }

        // --- 3. NÚT XÓA CODE ---
        function clearCode() {
            if(confirm("Bạn có chắc chắn muốn xóa toàn bộ code không?")) {
                editor.value = '';
                updatePreview();
                editor.focus();
            }
        }

        // --- 4. TÍNH NĂNG BẤM PHÍM TAB ĐỂ THỤT LỀ TRONG CODE ---
        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 2;
            }
        });

        // --- 5. TÍNH NĂNG KÉO THẢ ĐỂ CHIA TỈ LỆ MÀN HÌNH (DRAG RESIZER) ---
        const resizer = document.getElementById('dragMe');
        const leftPanel = document.getElementById('panel-left');
        let isResizing = false;

        resizer.addEventListener('mousedown', function(e) {
            isResizing = true;
            resizer.classList.add('active'); 
            document.body.style.cursor = 'col-resize';
            preview.style.pointerEvents = 'none'; 
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;
            const containerWidth = document.querySelector('.workspace').offsetWidth;
            const newWidth = (e.clientX / containerWidth) * 100;
            
            if (newWidth > 10 && newWidth < 90) {
                leftPanel.style.width = newWidth + '%';
            }
        });

        document.addEventListener('mouseup', function(e) {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.cursor = 'default';
                preview.style.pointerEvents = 'auto'; 
            }
        });
    </script>
</body>
              </html>
