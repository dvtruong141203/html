<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Master - Bỏ qua CORS & Xem Phản Hồi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        .row { width: 100%; }
        
        .col {
            width: 50%;
            float: left;
            padding: 24px;
            min-height: 580px;
        }

        .col-left {
            border-right: 1px solid #334155;
            background-color: #1e293b;
        }

        .col-right {
            background-color: #0f172a;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #38bdf8;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            border-color: #38bdf8;
            outline: none;
        }

        textarea {
            height: 240px;
            resize: vertical;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn:hover { background-color: #0369a1; }
        .btn:disabled { background-color: #475569; cursor: not-allowed; }

        .code-box {
            margin-bottom: 16px;
        }

        pre {
            background-color: #111827;
            color: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            height: 190px;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #jsonPreview { color: #facc15; }
        #responseBox { color: #4ade80; }
        #errorBox { color: #f87171; display: none; }

        .note {
            font-size: 11px;
            color: #38bdf8;
            margin-top: 6px;
            line-height: 1.4;
        }

        @media screen and (max-width: 768px) {
            .col {
                width: 100%;
                float: none;
                min-height: auto;
            }
            .col-left {
                border-right: none;
                border-bottom: 1px solid #334155;
            }
        }
    </style>
</head>
<body>

    <div class="container clearfix">
        <!-- CỘT TRÁI: CẤU HÌNH & NHẬP LIỆU -->
        <div class="col col-left">
            <h2>1. Cấu hình Webhook</h2>
            
            <div class="form-group">
                <label for="webhookUrl">Webhook URL Đích:</label>
                <input type="text" id="webhookUrl" placeholder="https://api.yourdomain.com/webhook">
                <div class="note">⚡ Công cụ tự động kích hoạt chế độ vượt rào chắn CORS để hiển thị phản hồi ngay lập tức.</div>
            </div>

            <div class="form-group">
                <label for="rawJson">Dữ liệu JSON Payload:</label>
                <textarea id="rawJson" placeholder='{&#10;  "event": "test_webhook",&#10;  "status": "success"&#10;}'></textarea>
            </div>

            <button id="sendBtn" class="btn">GỬI WEBHOOK VÀ XEM PHẢN HỒI</button>
        </div>

        <!-- CỘT PHẢI: KẾT QUẢ VÀ XEM TRƯỚC -->
        <div class="col col-right">
            <h2>2. Kết quả Phản hồi</h2>
            
            <div class="code-box">
                <label>Xem trước JSON:</label>
                <pre id="jsonPreview">Chờ dữ liệu...</pre>
            </div>

            <div class="code-box">
                <label>Phản hồi từ Server (Response):</label>
                <pre id="responseBox">Đang chờ gửi request...</pre>
                <pre id="errorBox"></pre>
            </div>
        </div>
    </div>

    <script>
        var rawJsonInput = document.getElementById('rawJson');
        var jsonPreview = document.getElementById('jsonPreview');
        var sendBtn = document.getElementById('sendBtn');
        var webhookUrlInput = document.getElementById('webhookUrl');
        var responseBox = document.getElementById('responseBox');
        var errorBox = document.getElementById('errorBox');
        
        var validPayload = {};

        // Kiểm tra tính hợp lệ của JSON theo thời gian thực
        function handleValidate() {
            var text = rawJsonInput.value.replace(/^\s+|\s+$/g, '');
            if (!text) {
                jsonPreview.textContent = "Chờ dữ liệu...";
                jsonPreview.style.color = "#facc15";
                validPayload = {};
                sendBtn.disabled = false;
                return;
            }

            try {
                validPayload = JSON.parse(text);
                jsonPreview.textContent = JSON.stringify(validPayload, null, 4);
                jsonPreview.style.color = "#facc15";
                sendBtn.disabled = false;
            } catch (err) {
                jsonPreview.textContent = "Lỗi Cú Pháp JSON:\n" + err.message;
                jsonPreview.style.color = "#f87171";
                validPayload = null;
                sendBtn.disabled = true;
            }
        }

        if (rawJsonInput.addEventListener) {
            rawJsonInput.addEventListener('input', handleValidate, false);
        } else {
            rawJsonInput.attachEvent('onkeyup', handleValidate);
        }

        // Gửi Webhook và tự động vượt rào CORS để lấy Response
        sendBtn.onclick = function() {
            var url = webhookUrlInput.value.replace(/^\s+|\s+$/g, '');

            errorBox.style.display = 'none';
            responseBox.style.display = 'block';

            if (!url) {
                responseBox.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.textContent = "Lỗi: Vui lòng nhập Webhook URL!";
                return;
            }

            sendBtn.innerHTML = "Đang gửi và lấy phản hồi...";
            sendBtn.disabled = true;

            // Sử dụng dịch vụ Corsproxy để lách tường lửa của trình duyệt
            var bypassUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);

            fetch(bypassUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(validPayload)
            })
            .then(function(response) {
                response.text().then(function(resultText) {
                    responseBox.style.color = "#4ade80";
                    responseBox.textContent = "✅ Gửi thành công!\nMã trạng thái (Status): " + response.status + "\n\nNội dung phản hồi từ Server:\n" + resultText;
                    sendBtn.innerHTML = "GỬI WEBHOOK VÀ XEM PHẢN HỒI";
                    sendBtn.disabled = false;
                });
            })
            .catch(function(error) {
                responseBox.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.textContent = "❌ Lỗi kết nối:\n" + error.message + "\n\n💡 Vui lòng kiểm tra lại đường dẫn URL đích xem có đang hoạt động hay không.";
                sendBtn.innerHTML = "GỬI WEBHOOK VÀ XEM PHẢN HỒI";
                sendBtn.disabled = false;
            });
        };
    </script>
</body>
</html>
