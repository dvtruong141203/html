<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Studio - Universal Fix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; /* Chống tràn toàn trang */
            display: flex;
        }
        
        /* Layout tổng thể chia 2 cột, không bị vỡ khung */
        .wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .pane {
            flex: 1;
            height: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto; /* Mỗi cột có thanh cuộn riêng nếu nội dung dài */
        }

        .left-pane {
            border-right: 1px solid #1e293b;
            background-color: #0f172a;
        }

        .right-pane {
            background-color: #111827;
        }

        /* Tiêu đề */
        .pane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }

        h2 { font-size: 16px; font-weight: 600; color: #e2e8f0; }
        
        .badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #1e293b;
            color: #38bdf8;
            font-weight: 500;
        }

        /* Form Controls */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group.expand {
            flex: 1; /* Giúp ô textarea co giãn chiếm hết không gian còn lại */
            min-height: 150px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #38bdf8;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 12px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        /* Nút bấm */
        .btn-send {
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover { background-color: #0369a1; }
        .btn-send:disabled { background-color: #475569; cursor: not-allowed; }

        /* Khung hiển thị kết quả (Code boxes) */
        .output-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 6px;
            overflow: hidden;
            min-height: 140px;
        }

        .output-header {
            padding: 8px 12px;
            background: #1a2234;
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }

        pre {
            padding: 12px;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            overflow-x: auto;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #jsonPreview { color: #facc15; }
        #responseBox { color: #4ade80; }
        #errorBox { color: #f87171; display: none; }

        .status-indicator {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #94a3b8;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- CỘT TRÁI: CẤU HÌNH & NHẬP LIỆU -->
        <div class="pane left-pane">
            <div class="pane-header">
                <h2>Cấu hình Gửi Webhook</h2>
                <span class="badge">Input Panel</span>
            </div>

            <div class="field-group">
                <label for="webhookUrl">Webhook URL Đích</label>
                <input type="text" id="webhookUrl" placeholder="https://api.yourdomain.com/endpoint">
            </div>

            <div class="field-group">
                <label for="modeSelect">Chế độ gửi (Khắc phục lỗi CORS)</label>
                <select id="modeSelect">
                    <option value="cors">Mặc định (CORS chuẩn)</option>
                    <option value="no-cors">Bỏ qua kiểm tra CORS (No-CORS Mode)</option>
                </select>
            </div>

            <div class="field-group expand">
                <label for="rawJson">Dữ liệu JSON Payload</label>
                <textarea id="rawJson" placeholder="{&#10;  &quot;key&quot;: &quot;value&quot;&#10;}"></textarea>
            </div>

            <button id="sendBtn" class="btn-send">GỬI WEBHOOK NGAY</button>
        </div>

        <!-- CỘT PHẢI: XEM TRƯỚC VÀ KẾT QUẢ -->
        <div class="pane right-pane">
            <div class="pane-header">
                <h2>Trạng thái & Phản hồi</h2>
                <span class="badge">Output Panel</span>
            </div>

            <!-- Box xem trước JSON -->
            <div class="output-box">
                <div class="output-header">
                    <span>Kiểm tra Cấu trúc JSON</span>
                    <span><i class="status-indicator" id="jsonDot"></i><span id="jsonStatus">Chưa nhập</span></span>
                </div>
                <pre id="jsonPreview">Chờ dữ liệu đầu vào...</pre>
            </div>

            <!-- Box phản hồi từ server -->
            <div class="output-box">
                <div class="output-header">
                    <span>Kết quả Phản hồi (Response)</span>
                    <span><i class="status-indicator" id="resDot"></i><span id="resStatus">Sẵn sàng</span></span>
                </div>
                <pre id="responseBox">Nhấn nút gửi để thực thi kết nối...</pre>
                <pre id="errorBox"></pre>
            </div>
        </div>
    </div>

    <script>
        const rawJsonInput = document.getElementById('rawJson');
        const jsonPreview = document.getElementById('jsonPreview');
        const sendBtn = document.getElementById('sendBtn');
        const webhookUrlInput = document.getElementById('webhookUrl');
        const responseBox = document.getElementById('responseBox');
        const errorBox = document.getElementById('errorBox');
        const modeSelect = document.getElementById('modeSelect');
        
        const jsonDot = document.getElementById('jsonDot');
        const jsonStatus = document.getElementById('jsonStatus');
        const resDot = document.getElementById('resDot');
        const resStatus = document.getElementById('resStatus');

        let validPayload = {};

        // Xử lý validate JSON thời gian thực
        function handleValidate() {
            const text = rawJsonInput.value.trim();
            if (!text) {
                jsonPreview.textContent = "Chờ dữ liệu đầu vào...";
                jsonPreview.style.color = "#facc15";
                jsonDot.style.background = "#94a3b8";
                jsonStatus.textContent = "Trống";
                validPayload = {};
                sendBtn.disabled = false;
                return;
            }

            try {
                validPayload = JSON.parse(text);
                jsonPreview.textContent = JSON.stringify(validPayload, null, 4);
                jsonPreview.style.color = "#facc15";
                jsonDot.style.background = "#4ade80";
                jsonStatus.textContent = "Hợp lệ";
                sendBtn.disabled = false;
            } catch (err) {
                jsonPreview.textContent = "Lỗi Cú Pháp JSON:\n" + err.message;
                jsonPreview.style.color = "#f87171";
                jsonDot.style.background = "#f87171";
                jsonStatus.textContent = "Lỗi cú pháp";
                sendBtn.disabled = true;
            }
        }

        rawJsonInput.addEventListener('input', handleValidate);

        // Xử lý gửi Webhook chống lỗi triệt để
        sendBtn.addEventListener('click', async () => {
            const url = webhookUrlInput.value.trim();
            const fetchMode = modeSelect.value;

            errorBox.style.display = 'none';
            responseBox.style.display = 'block';

            if (!url) {
                responseBox.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.textContent = "⚠️ Lỗi: Vui lòng nhập Webhook URL!";
                return;
            }

            sendBtn.textContent = "Đang gửi...";
            sendBtn.disabled = true;
            resDot.style.background = "#facc15";
            resStatus.textContent = "Đang kết nối...";

            try {
                let options = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(validPayload)
                };

                // Nếu người dùng chọn chế độ bỏ qua CORS
                if (fetchMode === 'no-cors') {
                    options.mode = 'no-cors';
                }

                const response = await fetch(url, options);

                // Nếu dùng chế độ no-cors, trình duyệt sẽ trả về response mờ (opaque), không đọc được text trực tiếp nhưng dữ liệu ĐÃ ĐƯỢC GỬI ĐI thành công tới server.
                if (fetchMode === 'no-cors') {
                    responseBox.style.color = "#38bdf8";
                    responseBox.textContent = "✅ Đã phát lệnh gửi thành công (Chế độ No-CORS).\n\nLưu ý: Do chính sách bảo mật trình duyệt ở chế độ No-CORS, kết quả phản hồi trả về dạng ẩn (opaque). Hãy kiểm tra trực tiếp ở hệ thống nhận Webhook của bạn để xác nhận dữ liệu đã đến!";
                    resDot.style.background = "#4ade80";
                    resStatus.textContent = "Đã gửi (No-CORS)";
                } else {
                    const resultText = await response.text();
                    if (response.ok) {
                        responseBox.style.color = "#4ade80";
                        responseBox.textContent = `✅ Thành công! (Mã: ${response.status})\n\n${resultText}`;
                        resDot.style.background = "#4ade80";
                        resStatus.textContent = `Thành công (${response.status})`;
                    } else {
                        responseBox.style.display = 'none';
                        errorBox.style.display = 'block';
                        errorBox.textContent = `⚠️ Server từ chối (Mã: ${response.status})\n\n${resultText}`;
                        resDot.style.background = "#f87171";
                        resStatus.textContent = `Lỗi HTTP ${response.status}`;
                    }
                }

            } catch (error) {
                responseBox.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.textContent = `❌ Lỗi kết nối / Bị chặn CORS từ trình duyệt:\n${error.message}\n\n👉 GỢI Ý KHẮC PHỤC:\nHãy đổi 'Chế độ gửi' thành 'Bỏ qua kiểm tra CORS (No-CORS Mode)' ở menu phía trên rồi bấm gửi lại.`;
                resDot.style.background = "#f87171";
                resStatus.textContent = "Lỗi kết nối";
            } finally {
                sendBtn.textContent = "GỬI WEBHOOK NGAY";
                sendBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
