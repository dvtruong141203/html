<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Apps Script - JSON Response Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .row { width: 100%; }
        
        .col {
            width: 50%;
            float: left;
            padding: 30px;
            min-height: 620px;
        }

        .col-left {
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #38bdf8;
            color: #38bdf8;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #cbd5e1;
            letter-spacing: 0.3px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            outline: none;
        }

        textarea {
            height: 250px;
            resize: vertical;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .code-box {
            margin-bottom: 20px;
        }

        pre {
            background-color: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 12px;
            height: 190px;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
        }

        #jsonPreview { color: #facc15; }
        #responseBox { color: #4ade80; }
        #errorBox { color: #f87171; display: none; }

        .note {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
            line-height: 1.4;
        }

        @media screen and (max-width: 768px) {
            body { padding: 10px; }
            .col {
                width: 100%;
                float: none;
                min-height: auto;
                padding: 20px;
            }
            .col-left {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }
        }
    </style>
</head>
<body>

    <div class="container clearfix">
        <!-- CỘT TRÁI: CẤU HÌNH -->
        <div class="col col-left">
            <div class="header-title">⚙️ Cấu hình Webhook GAS</div>
            
            <div class="form-group">
                <label for="webhookUrl">Google Apps Script Web URL:</label>
                <input type="text" id="webhookUrl" placeholder="https://script.google.com/macros/s/.../exec">
                <div class="note">Dán URL Web App đã được Deploy ở quyền "Anyone".</div>
            </div>

            <div class="form-group">
                <label for="rawJson">Dữ liệu JSON Payload:</label>
                <textarea id="rawJson" placeholder='{&#10;  "sheet": "Thanh toán",&#10;  "action": "add",&#10;  "amount": "500000"&#10;}'></textarea>
                <div class="note">Hệ thống tự động kiểm tra cú pháp JSON theo thời gian thực.</div>
            </div>

            <button id="sendBtn" class="btn">GỬI DỮ LIỆU ĐẾN APPS SCRIPT</button>
        </div>

        <!-- CỘT PHẢI: KẾT QUẢ -->
        <div class="col col-right">
            <div class="header-title">📊 Phản hồi dạng JSON</div>
            
            <div class="code-box">
                <label>Xem trước JSON (Payload Preview):</label>
                <pre id="jsonPreview">Chờ dữ liệu nhập vào...</pre>
            </div>

            <div class="code-box">
                <label>Phản hồi từ Server (Response JSON):</label>
                <pre id="responseBox">Đang chờ gửi request...</pre>
                <pre id="errorBox"></pre>
            </div>
        </div>
    </div>

    <script>
        var rawJsonInput = document.getElementById('rawJson');
        var jsonPreview = document.getElementById('jsonPreview');
        var sendBtn = document.getElementById('sendBtn');
        var webhookUrlInput = document.getElementById('webhookUrl');
        var responseBox = document.getElementById('responseBox');
        var errorBox = document.getElementById('errorBox');
        
        var validPayload = {};

        function handleValidate() {
            var text = rawJsonInput.value.replace(/^\s+|\s+$/g, '');
            if (!text) {
                jsonPreview.textContent = "Chờ dữ liệu nhập vào...";
                jsonPreview.style.color = "#facc15";
                validPayload = {};
                sendBtn.disabled = false;
                return;
            }

            try {
                validPayload = JSON.parse(text);
                jsonPreview.textContent = JSON.stringify(validPayload, null, 4);
                jsonPreview.style.color = "#facc15";
                sendBtn.disabled = false;
            } catch (err) {
                jsonPreview.textContent = "Lỗi Cú Pháp JSON:\n" + err.message;
                jsonPreview.style.color = "#f87171";
                validPayload = null;
                sendBtn.disabled = true;
            }
        }

        rawJsonInput.oninput = handleValidate;

        sendBtn.onclick = function() {
            var url = webhookUrlInput.value.replace(/^\s+|\s+$/g, '');

            errorBox.style.display = 'none';
            responseBox.style.display = 'block';

            if (!url) {
                responseBox.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.textContent = "Lỗi: Vui lòng nhập Webhook URL của Google Apps Script!";
                return;
            }

            if (!validPayload || Object.keys(validPayload).length === 0) {
                responseBox.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.textContent = "Lỗi: Dữ liệu JSON đang trống hoặc không hợp lệ!";
                return;
            }

            sendBtn.innerHTML = "Đang xử lý gửi...";
            sendBtn.disabled = true;

            fetch(url, {
                method: 'POST',
                redirect: 'follow',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(validPayload)
            })
            .then(function(response) {
                return response.text().then(function(resultText) {
                    try {
                        // Tự động phân tích chuỗi trả về thành đối tượng JSON và làm đẹp
                        var parsedJson = JSON.parse(resultText);
                        responseBox.style.color = "#4ade80";
                        responseBox.textContent = JSON.stringify(parsedJson, null, 4);
                    } catch (e) {
                        // Nếu server trả về dạng text thuần thì hiển thị dạng text
                        responseBox.style.color = "#4ade80";
                        responseBox.textContent = resultText;
                    }
                    sendBtn.innerHTML = "GỬI DỮ LIỆU ĐẾN APPS SCRIPT";
                    sendBtn.disabled = false;
                });
            })
            .catch(function(error) {
                responseBox.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.textContent = "❌ Lỗi kết nối:\n" + error.message + "\n\n💡 Kiểm tra lại URL hoặc quyền Deploy 'Anyone' của Apps Script.";
                sendBtn.innerHTML = "GỬI DỮ LIỆU ĐẾN APPS SCRIPT";
                sendBtn.disabled = false;
            });
        };
    </script>
</body>
</html>
