<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #06b6d4;
            --bg-body: #020617;
            --bg-input: rgba(30, 41, 59, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #34d399;
            --warning: #fbbf24;
            --error: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 60%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px; 
            overflow: hidden; 
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        .container {
            width: 100%;
            max-width: 1100px;
            background: transparent;
            box-shadow: none;
            border: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px; 
            height: calc(100vh - 40px); 
            max-height: 600px; 
        }

        .col {
            padding: 10px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .header-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; 
        }

        label {
            font-weight: 500;
            font-size: 13px;
            color: #cbd5e1;
            letter-spacing: 0.2px;
        }

        .icon-btn-group {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--bg-input);
            color: var(--primary);
            border-color: var(--primary);
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            font-family: 'Fira Code', monospace;
            transition: all 0.25s ease;
        }

        input[type="password"] { letter-spacing: 2px; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
        .input-wrapper input { padding-right: 40px; }

        .toggle-btn {
            position: absolute; right: 12px; background: none; border: none;
            color: var(--text-muted); cursor: pointer; padding: 4px;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.2s;
        }
        .toggle-btn:hover { color: var(--primary); }

        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            outline: none;
            background-color: rgba(30, 41, 59, 0.8);
        }

        textarea {
            flex-grow: 1; 
            resize: none; 
            line-height: 1.6;
        }

        .btn {
            padding: 14px; background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff; border: none; border-radius: 8px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            flex-shrink: 0;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { background: #334155; cursor: not-allowed; color: #94a3b8; opacity: 1; }

        .code-window {
            background: #0f172a; border: 1px solid var(--border-color);
            border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
        }
        
        .preview-window { height: 35%; flex-shrink: 0; }
        .response-window { height: 65%; flex-shrink: 0; }

        .window-header {
            background: rgba(255,255,255,0.03); padding: 8px 14px;
            border-bottom: 1px solid var(--border-color); display: flex;
            align-items: center; gap: 10px; font-size: 12px; font-weight: 500; color: var(--text-muted);
            flex-shrink: 0;
        }
        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ef4444; } .dot-yellow { background: #f59e0b; } .dot-green { background: #10b981; }

        pre {
            padding: 14px; margin: 0; font-family: 'Fira Code', monospace;
            font-size: 13px; flex-grow: 1; overflow: auto; 
            white-space: pre-wrap; word-wrap: break-word; line-height: 1.6;
        }

        #jsonPreview { color: var(--warning); }
        #responseBox { color: var(--success); }
        #errorBox { color: var(--error); display: none; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: #0f172a; border: 1px solid var(--border-color); border-radius: 12px;
            width: 100%; max-width: 450px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: translateY(20px); transition: transform 0.2s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; color: var(--text-main); font-weight: 600;
        }
        .close-modal {
            background: none; border: none; color: var(--text-muted); font-size: 20px;
            cursor: pointer; transition: color 0.2s;
        }
        .close-modal:hover { color: var(--error); }

        .history-list {
            max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }
        .history-item {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px 12px; font-family: 'Fira Code', monospace;
            font-size: 12px; color: var(--text-muted); cursor: pointer; transition: all 0.2s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .history-item:hover { background: rgba(59, 130, 246, 0.1); border-color: var(--primary); color: var(--primary); }
        .empty-history { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }

        /* ====== SỬA LỖI GIAO DIỆN MOBILE TẠI ĐÂY ====== */
        @media screen and (max-width: 900px) {
            body { 
                overflow: auto; /* Cho phép cuộn trang trên mobile */
                align-items: flex-start; /* Không căn giữa dọc trên mobile */
            }
            .container { 
                grid-template-columns: 1fr; gap: 24px; 
                height: auto; max-height: none; /* Bỏ giới hạn chiều cao */
            }
            .col { 
                height: auto; padding: 0; gap: 16px;
            }
            textarea {
                flex-grow: 0; /* Ngăn text area tự giãn vô hạn */
                height: 200px; /* Cố định chiều cao ô nhập liệu */
            }
            .preview-window { 
                height: 180px; /* Cố định chiều cao khung preview */
            }
            .response-window { 
                height: 400px; /* Cố định chiều cao khung response */
            }
        }
    </style>
</head>
<body>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>⚙️ Cấu hình Webhook URL</span>
                <button class="close-modal" id="closeSettingsBtn">&times;</button>
            </div>
            <label for="webhookUrl" style="display:block; margin-bottom:8px;">Google Apps Script Web URL</label>
            <div class="input-wrapper">
                <input type="password" id="webhookUrl" placeholder="https://script.google.com/macros/s/.../exec">
                <button type="button" id="toggleUrlBtn" class="toggle-btn" title="Hiện/Ẩn API">
                    <svg id="icon-eye-slash" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 18px; height: 18px;">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                </button>
            </div>
            <button id="saveSettingsBtn" class="btn" style="margin-top: 16px; width: 100%; padding: 10px;">Lưu & Đóng</button>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>🕒 Lịch sử dữ liệu (Mới nhất)</span>
                <button class="close-modal" id="closeHistoryBtn">&times;</button>
            </div>
            <div class="history-list" id="historyListContainer"></div>
        </div>
    </div>

    <div class="container">
        <div class="col col-left">
            <div class="header-tools">
                <label for="rawJson">Dữ liệu JSON Payload</label>
                <div class="icon-btn-group">
                    <button class="icon-btn" id="openHistoryBtn" title="Xem lịch sử">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 18px; height: 18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                    </button>
                    <button class="icon-btn" id="openSettingsBtn" title="Cấu hình API">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 18px; height: 18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                    </button>
                </div>
            </div>

            <textarea id="rawJson" placeholder='{&#10;  "sheet": "Thanh toán",&#10;  "action": "add",&#10;  "amount": "500000"&#10;}'></textarea>

            <button id="sendBtn" class="btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:18px; height:18px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                </svg>
                GỬI DỮ LIỆU TỚI SERVER
            </button>
        </div>

        <div class="col col-right">
            <div class="code-window preview-window">
                <div class="window-header">
                    <div class="dots">
                        <div class="dot dot-red"></div>
                        <div class="dot dot-yellow"></div>
                        <div class="dot dot-green"></div>
                    </div>
                    Payload Preview
                </div>
                <pre id="jsonPreview">{}</pre>
            </div>

            <div class="code-window response-window">
                <div class="window-header">
                    <div class="dots">
                        <div class="dot dot-red"></div>
                        <div class="dot dot-yellow"></div>
                        <div class="dot dot-green"></div>
                    </div>
                    Response JSON
                </div>
                <pre id="responseBox">Đang chờ gửi request...</pre>
                <pre id="errorBox"></pre>
            </div>
        </div>
    </div>

    <script>
        var rawJsonInput = document.getElementById('rawJson');
        var jsonPreview = document.getElementById('jsonPreview');
        var sendBtn = document.getElementById('sendBtn');
        var webhookUrlInput = document.getElementById('webhookUrl');
        var responseBox = document.getElementById('responseBox');
        var errorBox = document.getElementById('errorBox');
        var toggleUrlBtn = document.getElementById('toggleUrlBtn');
        
        var settingsModal = document.getElementById('settingsModal');
        var historyModal = document.getElementById('historyModal');
        var historyListContainer = document.getElementById('historyListContainer');
        
        var validPayload = {}; 
        var jsonHistory = [];

        const iconEyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 18px; height: 18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>`;
        const iconEyeSlash = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 18px; height: 18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>`;

        window.onload = function() {
            var savedUrl = localStorage.getItem('gas_webhook_url');
            var savedJson = localStorage.getItem('gas_raw_json');
            var savedHistory = localStorage.getItem('gas_json_history');
            
            if (savedUrl) webhookUrlInput.value = savedUrl;
            if (savedJson !== null) rawJsonInput.value = savedJson;
            if (savedHistory) {
                try { jsonHistory = JSON.parse(savedHistory); } catch (e) {}
            }
            
            handleValidate();
        };

        document.getElementById('openSettingsBtn').onclick = () => settingsModal.classList.add('active');
        document.getElementById('closeSettingsBtn').onclick = () => settingsModal.classList.remove('active');
        document.getElementById('saveSettingsBtn').onclick = () => {
            localStorage.setItem('gas_webhook_url', webhookUrlInput.value);
            settingsModal.classList.remove('active');
        };

        document.getElementById('openHistoryBtn').onclick = () => {
            renderHistory();
            historyModal.classList.add('active');
        };
        document.getElementById('closeHistoryBtn').onclick = () => historyModal.classList.remove('active');

        function renderHistory() {
            historyListContainer.innerHTML = '';
            if (jsonHistory.length === 0) {
                historyListContainer.innerHTML = '<div class="empty-history">Chưa có lịch sử gửi nào.</div>';
                return;
            }
            
            jsonHistory.forEach((item) => {
                let div = document.createElement('div');
                div.className = 'history-item';
                div.textContent = JSON.stringify(item);
                div.onclick = () => {
                    rawJsonInput.value = JSON.stringify(item, null, 2);
                    handleValidate();
                    historyModal.classList.remove('active');
                };
                historyListContainer.appendChild(div);
            });
        }

        function saveToHistory(payload) {
            if (jsonHistory.length > 0 && JSON.stringify(jsonHistory[0]) === JSON.stringify(payload)) return;
            
            jsonHistory.unshift(payload); 
            if (jsonHistory.length > 20) jsonHistory.pop(); 
            localStorage.setItem('gas_json_history', JSON.stringify(jsonHistory));
        }

        window.onclick = function(event) {
            if (event.target == settingsModal) settingsModal.classList.remove('active');
            if (event.target == historyModal) historyModal.classList.remove('active');
        };

        toggleUrlBtn.onclick = function() {
            if (webhookUrlInput.type === 'password') {
                webhookUrlInput.type = 'text'; toggleUrlBtn.innerHTML = iconEyeOpen;
            } else {
                webhookUrlInput.type = 'password'; toggleUrlBtn.innerHTML = iconEyeSlash;
            }
        };

        webhookUrlInput.oninput = function() {
            localStorage.setItem('gas_webhook_url', webhookUrlInput.value);
        };

        function handleValidate() {
            var text = rawJsonInput.value.replace(/^\s+|\s+$/g, '');
            localStorage.setItem('gas_raw_json', rawJsonInput.value);

            if (!text) {
                jsonPreview.textContent = "{}";
                jsonPreview.style.color = "var(--warning)";
                validPayload = {}; 
                sendBtn.disabled = false; 
                return;
            }

            try {
                validPayload = JSON.parse(text);
                jsonPreview.textContent = JSON.stringify(validPayload, null, 4);
                jsonPreview.style.color = "var(--warning)";
                sendBtn.disabled = false;
            } catch (err) {
                jsonPreview.textContent = "Lỗi Cú Pháp JSON:\n" + err.message;
                jsonPreview.style.color = "var(--error)";
                validPayload = null; 
                sendBtn.disabled = true;
            }
        }

        rawJsonInput.oninput = handleValidate;

        sendBtn.onclick = function() {
            var url = webhookUrlInput.value.replace(/^\s+|\s+$/g, '');
            errorBox.style.display = 'none'; responseBox.style.display = 'block';

            if (!url) {
                responseBox.style.display = 'none'; errorBox.style.display = 'block';
                errorBox.textContent = "Lỗi: Vui lòng cấu hình Webhook URL trong mục Cài đặt (⚙️)!";
                settingsModal.classList.add('active'); 
                return;
            }

            sendBtn.innerHTML = "Đang xử lý gửi...";
            sendBtn.disabled = true;

            var payloadToSend = validPayload || {};

            fetch(url, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payloadToSend)
            })
            .then(function(response) {
                return response.text().then(function(resultText) {
                    try {
                        var parsedJson = JSON.parse(resultText);
                        responseBox.style.color = "var(--success)";
                        responseBox.textContent = JSON.stringify(parsedJson, null, 4);
                    } catch (e) {
                        responseBox.style.color = "var(--success)";
                        responseBox.textContent = resultText;
                    }
                    saveToHistory(payloadToSend); 
                    sendBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:18px; height:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" /></svg> GỬI DỮ LIỆU TỚI SERVER`;
                    sendBtn.disabled = false;
                });
            })
            .catch(function(error) {
                responseBox.style.display = 'none'; errorBox.style.display = 'block';
                errorBox.textContent = "❌ Lỗi kết nối:\n" + error.message + "\n\n💡 Kiểm tra lại URL hoặc quyền Deploy 'Anyone' của Apps Script.";
                sendBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:18px; height:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" /></svg> GỬI DỮ LIỆU TỚI SERVER`;
                sendBtn.disabled = false;
            });
        };
    </script>
</body>
</html>
